services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .nginx.env
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    restart: unless-stopped
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .wordpress.env
  
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    restart: unless-stopped
    networks:
      - inception
    volumes:
      - mariadb:/database
    env_file:
      - .mariadb.env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwpuser", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  inception:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/inception/data/wp
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/inception/data/db