services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    ports:
      - "9000"
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
  
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    ports:
      - "3306"
    networks:
      - inception
    volumes:
      - mariadb:/database

networks:
  inception:
    driver: bridge

volumes:
  wordpress_data:
  mariadb: